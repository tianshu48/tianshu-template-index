name: Ingest proposals

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rewrite:
        description: Rewrite shards and resign channel from index.v1.json
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ingest
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TIANSHU_ORIGIN: ${{ vars.TIANSHU_ORIGIN }}
          PK_SERVER_HEX: ${{ vars.PK_SERVER_HEX }}
          PACKS_TOKEN: ${{ secrets.PACKS_TOKEN }}
          INDEX_SK: ${{ secrets.INDEX_SK }}
          REWRITE_INDEX: ${{ github.event_name == 'workflow_dispatch' && inputs.rewrite && '1' || '' }}
        run: node scripts/ingest.mjs
